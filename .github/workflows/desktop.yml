name: Desktop Build

# Builds Forge Desktop installers for Windows (.exe/.msi) and macOS (.dmg/.app).
# Windows can only produce Windows bundles and macOS only macOS bundles, so a
# per-OS matrix of GitHub-hosted runners is the standard approach.
#
# macOS: macos-latest = Apple Silicon (arm64 dmg), macos-13 = Intel (x64 dmg).
#   On a PUBLIC repo both are free; on a private repo macOS minutes cost ~10x.
# Windows: produces the NSIS setup.exe + MSI (WiX is fetched automatically).
#
# Signing/notarization is fully optional: fill the APPLE_*/WINDOWS_* secrets
# to get Gatekeeper-clean macOS apps and SmartScreen-clean Windows installers.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button

jobs:
  build-desktop:
    name: Forge Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build + bundle installers (tauri-action)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          args: --verbose
          # NOTE: tauri-action picks up macOS signing/notarization from the
          # process env ONLY when the secrets exist. Do NOT add an env: block
          # here with empty ${{ secrets.* }} values - an empty APPLE_CERTIFICATE
          # makes the macOS runner fail with "failed to import keychain
          # certificate". To enable signing later, add env: with the real
          # secret names (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # for macOS; WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD,
          # WINDOWS_CERTIFICATE_THUMBPRINT + tauri.conf.json
          # bundle.windows.certificateThumbprint for Windows) once the
          # corresponding repository secrets are configured.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: forge-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn